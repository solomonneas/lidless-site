<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- lidless eye: almond aperture that never closes, iris ring, pupil, glint; follows the OS color scheme -->
  <style>
    .tile { fill: #070c0c; }
    .ink { stroke: #e9eeef; }
    .dot { fill: #e9eeef; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #fafdfd; }
      .ink { stroke: #0a1313; }
      .dot { fill: #0a1313; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="12"/>
  <path class="tile ink" d="M14 32 C23.5 21, 40.5 21, 50 32 C40.5 43, 23.5 43, 14 32 Z" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="ink" cx="32" cy="32" r="9" fill="none" stroke-width="3"/>
  <circle class="dot" cx="32" cy="32" r="4"/>
  <circle class="dot" cx="35.8" cy="28.2" r="2"/>
</svg>
